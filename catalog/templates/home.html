<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novaux</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700;900&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    font-family: 'Montserrat', sans-serif;
    color: #fff;
}

.wrapper {
    max-width: 420px;
    margin: 20px auto;
    border-radius: 40px;
    overflow: hidden;
    background: #000;
}

.logo {
    text-align: center;
    padding: 30px 0;
    letter-spacing: 6px;
    font-weight: 500;
    font-size: 18px;
}

.hero {
    padding: 20px;
}

.hero img {
    width: 100%;
    border-radius: 20px;
}

.card {
    background: #e8e4db;
    color: #000;
    margin: 0 20px;
    margin-top: -60px;
    border-radius: 25px;
    padding: 40px 20px;
    text-align: center;
    position: relative;
    z-index: 2;
}

.card h1 {
    font-size: 40px;
    font-weight: 900;
    line-height: 1.05;
}

.card p {
    margin: 20px 0 30px;
    font-size: 15px;
}

.btn {
    display: inline-block;
    background: #000;
    color: #fff;
    padding: 15px 50px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 600;
}

.section {
    padding: 60px 20px;
    text-align: center;
}

.section h2 {
    font-size: 30px;
}

.promo {
    position: relative;
    height: 300px;
    background: url('your-second-image.jpg') center/cover no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.promo::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.5);
}

.promo-content {
    position: relative;
    z-index: 2;
}

.footer {
    text-align: center;
    padding: 40px 20px;
    font-size: 13px;
    opacity: 0.6;
}

.socials span {
    margin: 0 10px;
}
</style>

</head>

<body>

<div class="wrapper">

<div class="logo">NOVAUX</div>

<div class="hero">
    <img src="your-main-image.jpg" alt="">
</div>

<div class="card">
    <h1>BEYOND<br>CASUAL</h1>
    <p>Discover a new level of comfort and style.</p>
    <a href="/" class="btn">SHOP NOW</a>
</div>

<div class="section">
    <h2>What We Offer</h2>
</div>

<div class="promo">
    <div class="promo-content">
        <p>Shop now and save big on your next order.</p>
        <a href="/" class="btn">ORDER NOW</a>
    </div>
</div>

<div class="footer">
    <div>NOVAUX</div>
    <p>© 2024. All Rights Reserved.</p>

    <div class="socials">
        <span>f</span>
        <span>ig</span>
        <span>x</span>
    </div>
</div>

</div>

</body>
</html>
